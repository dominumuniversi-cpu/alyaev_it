# Стенд alyaev.it — продакшн-подобная среда на DIMAS.
# Данные: E:\DockerData\alyaev-it (bind-mount), конфиг: E:\DockerData\alyaev-it\.env
name: alyaev-it

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: alyaev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /e/DockerData/alyaev-it/pgdata:/var/lib/postgresql/data
    networks: [shared]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: alyaev-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: stand
    volumes:
      # Файлы вне образа: иначе исчезнут при пересборке.
      - /e/DockerData/alyaev-it/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks: [shared]

  frontend:
    build:
      context: ../frontend
      args:
        # ID счётчиков нужны на этапе сборки: NEXT_PUBLIC_* вшиваются в бандл.
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        # Пустое значение = сайт в корне (домен); /alyaev = стенд по префиксу.
        # ВНИМАНИЕ: синтаксис ${VAR:-default} тут НЕЛЬЗЯ — Compose считает пустую
        # переменную отсутствующей и подставляет default, сайт уезжает в /alyaev/.
        BASE_PATH: ${FRONTEND_BASE_PATH}
        # SITE_URL попадает в сборку: robots.txt и sitemap — статические маршруты,
        # они генерятся на build, а не на каждый запрос. Без этого аргумента
        # в образ вшивается http://localhost, и поисковик получает мёртвый адрес.
        SITE_URL: ${SITE_URL:-https://alyaev.ru}
    container_name: alyaev-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
      # На стенде сайт по префиксу /alyaev/; на домене — пусто (корень).
      BASE_PATH: ${FRONTEND_BASE_PATH}
      # Публичный адрес для canonical, OG и sitemap. Домена пока нет — стендовый адрес.
      # При появлении домена: поменять SITE_URL в .env и пересобрать frontend.
      SITE_URL: ${SITE_URL:-https://alyaev.ru}
      # ID счётчиков. Пусто = счётчик не грузится (docs/manifests/analytics.md).
      # Значение вшивается в сборку, поэтому после прописывания нужна пересборка frontend.
      NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    depends_on: [backend]
    networks: [shared]

networks:
  shared:
    name: npc-proxy-net
    external: true
